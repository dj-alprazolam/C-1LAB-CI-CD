name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
      
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release
      
      - name: Package
        run: |
          cd build
          cmake --build . --target package
      
      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: build/*.deb

  build-windows:
    runs-on: windows-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install Boost via Chocolatey
        run: |
          choco install boost-msvc-14.3 -y
        shell: powershell
      
      - name: Find Boost installation
        run: |
          $boostPath = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Filter "boost*" -Directory | Select-Object -First 1
          if ($boostPath) {
            echo "BOOST_ROOT=$($boostPath.FullName)" >> $env:GITHUB_ENV
            echo "Boost found at: $($boostPath.FullName)"
          } else {
            # Пробуем другие варианты
            $altPaths = @(
              "C:\Program Files\Boost",
              "C:\Libraries\boost",
              "C:\boost"
            )
            foreach ($path in $altPaths) {
              if (Test-Path $path) {
                echo "BOOST_ROOT=$path" >> $env:GITHUB_ENV
                echo "Boost found at: $path"
                break
              }
            }
          }
        shell: powershell
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DPATCH_VERSION=${{ github.run_number }} -DBOOST_ROOT="$env:BOOST_ROOT" -DCMAKE_BUILD_TYPE=Release
        shell: powershell
      
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
        shell: powershell
      
      - name: Run tests
        run: |
          cd build
          ctest -C Release --output-on-failure
        shell: powershell
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/Release/helloworld_cli.exe

  create-release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    permissions: write-all
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/ubuntu-package/*.deb
            ./artifacts/windows-exe/helloworld_cli.exe