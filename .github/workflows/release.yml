name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
      
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release
      
      - name: Package
        run: |
          cd build
          cmake --build . --target package
      
      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: build/*.deb

  build-windows:
    runs-on: windows-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install Boost via Chocolatey
        run: |
          choco install boost-msvc-14.3 -y
          # Находим путь установки
          echo "BOOST_ROOT=C:\ProgramData\chocolatey\lib\boost-msvc-14.3" >> $env:GITHUB_ENV
        shell: powershell
      

      - name: Check Boost installation
        run: |
          dir "C:\ProgramData\chocolatey\lib\boost-msvc-14.3"
          dir "C:\ProgramData\chocolatey\lib\boost-msvc-14.3\lib"
        shell: powershell
        continue-on-error: true
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DPATCH_VERSION=${{ github.run_number }} -DBOOST_ROOT="$env:BOOST_ROOT" -DCMAKE_BUILD_TYPE=Release
        shell: powershell
      
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
        shell: powershell
      
      - name: Run tests
        run: |
          cd build
          ctest -C Release --output-on-failure
        shell: powershell
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/Release/helloworld_cli.exe

  create-release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    permissions: write-all
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: List artifacts
        run: |
          ls -la ./artifacts/
          ls -la ./artifacts/ubuntu-package/ || true
          ls -la ./artifacts/windows-exe/ || true
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/ubuntu-package/*.deb
            ./artifacts/windows-exe/*.exe